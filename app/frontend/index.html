<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DataPulse Dashboard</title>
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">DataPulse</p>
        <h1>Dashboard financeiro</h1>
      </div>
    </header>

    <main class="dashboard">
      <section class="cards" id="summary-cards"></section>

      <section class="panel import-panel">
        <div class="panel-header">
          <h2>Importação CSV</h2>
        </div>

        <form id="csv-import-form" class="import-form">
          <label class="file-field" for="csv-file">
            <span>Selecionar arquivo CSV</span>
            <input id="csv-file" name="file" type="file" accept=".csv,text/csv" />
          </label>

          <div class="form-actions">
            <button id="preview-button" type="submit" class="primary">Pré-visualizar</button>
            <label class="checkbox-row">
              <input id="include-duplicates" type="checkbox" />
              <span>Incluir duplicatas detectadas</span>
            </label>
          </div>
        </form>

        <div id="import-status" class="status hidden" aria-live="polite"></div>

        <div id="preview-summary" class="preview-summary hidden"></div>
        <div id="preview-errors" class="preview-errors hidden"></div>
        <div id="preview-table-wrap" class="preview-table-wrap hidden">
          <table>
            <thead>
              <tr>
                <th>Linha</th>
                <th>Data</th>
                <th>Descrição</th>
                <th>Categoria</th>
                <th>Tipo</th>
                <th>Valor</th>
              </tr>
            </thead>
            <tbody id="preview-table-body"></tbody>
          </table>
        </div>

        <div class="confirm-actions hidden" id="confirm-actions">
          <button id="confirm-import-button" type="button" class="danger">Confirmar importação</button>
        </div>
      </section>
    </main>

    <script src="./js/api.js"></script>
    <script src="./js/app.js"></script>
  </body>
</html>
